name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEMO_MODE: "true"
      JWT_SECRET: "ci-only-not-for-deployment-secret-value"
      DATABASE_URL: postgresql+psycopg2://paybridge_ci:ci-only-not-a-secret@localhost:5432/paybridge_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: paybridge_ci
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: paybridge_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U paybridge_ci -d paybridge_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (Ruff)
        run: ruff check backend frontend ml tests

      - name: Type check (Mypy)
        run: mypy backend/app/models backend/app/core backend/app/schemas backend/app/services --ignore-missing-imports

      - name: Bootstrap data & schema
        run: |
          cd backend
          alembic upgrade head
          cd ..
          python backend/scripts/setup_all.py

      - name: Verify database migration head
        run: |
          cd backend
          alembic current

      - name: Automated test suite (Unit & Integration)
        run: pytest tests/ -v --cov=backend/app --cov=ml --cov-report=term-missing

      - name: RAG evaluation (Retrieval & Grounding)
        run: python backend/scripts/run_rag_eval.py

      - name: Agent & Security evaluation (Guardrails & Governance)
        run: python backend/scripts/run_agent_eval.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t opspilot-api .
      - name: Build dashboard image
        run: docker build -f frontend/Dockerfile -t opspilot-dashboard .
