name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (Ruff)
        run: ruff check app dashboard scripts tests

      - name: Type check (Mypy)
        run: mypy app/models app/core app/schemas app/services --ignore-missing-imports

      - name: Bootstrap data & schema
        run: python scripts/setup_all.py

      - name: Verify database migration head
        run: alembic current

      - name: Automated test suite (Unit & Integration)
        run: pytest tests/ -v --cov=app --cov-report=term-missing

      - name: RAG evaluation (Retrieval & Grounding)
        run: python scripts/run_rag_eval.py

      - name: Agent & Security evaluation (Guardrails & Governance)
        run: python scripts/run_agent_eval.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t opspilot-api .
      - name: Build dashboard image
        run: docker build -f docker/Dockerfile.dashboard -t opspilot-dashboard .
